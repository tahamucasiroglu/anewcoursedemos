# scripts/check.conf — ANEW Konsept · walking skeleton (plan 0001) ile etkinleşti.
# Format: <name>: <command> · hızlı adımlar adında [fast] taşır · requires <step>: <command>
# (docs/testing.md, Two speeds / Resource hygiene). Stack: .NET 10, Node (Vitest).
# Seçici (Two speeds kural 4): xUnit trait Category=Integration. fast = Category!=Integration,
# full yalnızca tersini ekler; böylece her test iki profilden birinde koşar.
# Kaynak hijyeni: MSBuild node reuse ve derleme sunucusu kapalı (iz bırakmaz).

# --- Prerequisites ---
requires build: dotnet --version

# --- Fast profile ---
build [fast]: dotnet build Konsept.sln -c Release -nodeReuse:false -p:UseSharedCompilation=false
format [fast]: dotnet format Konsept.sln --verify-no-changes
vulnerable [fast]: out=$(DOTNET_CLI_UI_LANGUAGE=en dotnet list Konsept.sln package --vulnerable --include-transitive 2>&1) || { echo "$out"; exit 1; }; echo "$out" | grep "vulnerable packages"; echo "$out" | grep -q "has no vulnerable packages" && ! echo "$out" | grep -q "following vulnerable"
