# scripts/check.conf — ANEW Konsept · walking skeleton (plan 0001) ile etkinleşti.
# Format: <name>: <command> · hızlı adımlar adında [fast] taşır · requires <step>: <command>
# (docs/testing.md, Two speeds / Resource hygiene). Stack: .NET 10, Node (Vitest).
# Seçici (Two speeds kural 4): xUnit trait Category=Integration. fast = Category!=Integration,
# full yalnızca tersini ekler; böylece her test iki profilden birinde koşar.
# Kaynak hijyeni: her dotnet adımında MSBuild node reuse (MSBUILDDISABLENODEREUSE=1) ve derleme sunucusu
# kapalı; restore/format/list komutları da arkada MSBuild düğümü bırakmaz.

# --- Prerequisites ---
requires build: dotnet --version
requires js-test: node -e "process.exit(+process.versions.node.split('.')[0] >= 22 ? 0 : 1)"
requires integration: sh scripts/test-db/run-integration.sh --check

# --- Fast profile ---
build [fast]: MSBUILDDISABLENODEREUSE=1 dotnet build Konsept.sln -c Release -nodeReuse:false -p:UseSharedCompilation=false
format [fast]: MSBUILDDISABLENODEREUSE=1 dotnet format Konsept.sln --verify-no-changes
vulnerable [fast]: out=$(MSBUILDDISABLENODEREUSE=1 DOTNET_CLI_UI_LANGUAGE=en dotnet list Konsept.sln package --vulnerable --include-transitive 2>&1) || { echo "$out"; exit 1; }; echo "$out" | grep "vulnerable packages"; echo "$out" | grep -q "has no vulnerable packages" && ! echo "$out" | grep -q "following vulnerable"
unit [fast]: MSBUILDDISABLENODEREUSE=1 dotnet test Konsept.sln -c Release --no-build --filter "Category!=Integration"
no-fetch [fast]: ! grep -rn "fetch(" src/Konsept.Web/wwwroot/js --include=*.js --exclude-dir=__tests__
no-inline-style [fast]: ! grep -rn 'style="' src/Konsept.Web/Views
js-test [fast]: npm --prefix src/Konsept.Web ci --no-audit --no-fund --loglevel=error && npm --prefix src/Konsept.Web run test -- --run
npm-audit [fast]: npm --prefix src/Konsept.Web audit --audit-level=high

# --- Full only ---
# PostgreSQL 17 entegrasyon testleri: geçici, taşınabilir cluster (Docker yok, plan 0001 R-1).
integration: sh scripts/test-db/run-integration.sh
