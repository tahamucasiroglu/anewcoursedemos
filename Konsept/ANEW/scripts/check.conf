# scripts/check.conf — ANEW Konsept · bootstrap 2026-11-14
# GREENFIELD: kod henüz yok (kural 1: spec yoksa kod yok). Aşağıdaki adımlar PLANLANMIŞ adımlardır ve
# yorum satırıdır; ilk spec olan walking skeleton bunları (gerekirse düzelterek) etkinleştirir.
# Format: <name>: <command> · hızlı adımlar adında [fast] taşır · requires <step>: <command>
# (docs/testing.md, Two speeds / Resource hygiene). Stack: .NET 10, Node LTS (Vitest), Docker (Testcontainers).
#
# --- Prerequisites (planned) ---
# requires build: dotnet --version
# requires js-test: node -e "process.exit(+process.versions.node.split('.')[0] >= 22 ? 0 : 1)"
# requires integration: docker info
#
# --- Fast profile (planned) ---
# resource hygiene: build sunucusu/MSBuild node reuse bırakılmaz
# build [fast]: dotnet build Konsept.sln -c Release -nodeReuse:false -p:UseSharedCompilation=false
# format [fast]: dotnet format Konsept.sln --verify-no-changes
# unit [fast]: dotnet test Konsept.sln -c Release --no-build --filter "Category!=Integration"
# arch [fast]: (unit adımında: Konsept.ArchitectureTests — Y-1..Y-8, K-1, K-2, K-4)
# no-fetch [fast]: ! grep -rn "fetch(" src/Konsept.Web/wwwroot/js --include=*.js --exclude-dir=__tests__ --exclude-dir=lib
# no-inline-style [fast]: ! grep -rn 'style="' src/Konsept.Web/Views
# js-test [fast]: npm --prefix src/Konsept.Web run test -- --run
# vulnerable [fast]: dotnet list Konsept.sln package --vulnerable --include-transitive
# npm-audit [fast]: npm --prefix src/Konsept.Web audit --audit-level=high
#
# --- Full only (planned) ---
# requires render: ffmpeg -version
# integration: dotnet test Konsept.sln -c Release --no-build --filter "Category=Integration"
# ajan render entegrasyonu (FFmpeg/Node gerektirir):
# render: dotnet test Konsept.sln -c Release --no-build --filter "Category=Render"
#
# Not: komutlar walking skeleton'da gerçek proje adlarıyla doğrulanır; test-sayısı kontrolü ve residue
# testi (her iki profil) o işte yapılır. Tek ve gerçek komut yorumdan çıkarılınca geçerlidir.
