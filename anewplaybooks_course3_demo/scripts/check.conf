# scripts/check.conf — the steps behind ./scripts/check (bootstrap 2026-11-21, adoption).
# Python 3 + Flask, single module app.py. Format: <name>: <command> — runs in order, fails fast.
#
# Resource hygiene inventory (docs/testing.md, Resource hygiene):
# - No step starts a server: `import app` does not call app.run() (it is behind __main__), and
#   pytest uses Flask's test_client, in the same process. No daemon, no watcher, no browser.
# - Data: Db lives in memory and dies with the process; tests call seed() before each test.
# - Files: -B / PYTHONDONTWRITEBYTECODE keep __pycache__ out of the tree.
#
# Prerequisites: python 3, Flask and pytest importable (pip install -r requirements.txt).
requires syntax: python -c "import sys; sys.exit(0 if sys.version_info >= (3, 8) else 1)"
requires import: python -B -c "import flask"

# resource hygiene: no bytecode files written (-B)
syntax [fast]: python -B -c "import ast; ast.parse(open('app.py', encoding='utf-8').read(), 'app.py')"
# imports app.py without starting the server: Flask present, module-level seed() runs clean
import [fast]: python -B -c "import app"

# Characterization + all tests under tests/ (pytest discovery is the selector; spec 0001).
# The suite takes well under a second, so it runs in both profiles.
requires test: python -B -c "import pytest"
# resource hygiene: no bytecode, no .pytest_cache written
test [fast]: python -B -m pytest -q -p no:cacheprovider
