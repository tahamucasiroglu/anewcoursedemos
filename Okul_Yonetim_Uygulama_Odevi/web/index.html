<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Okul Yönetim Platformu</title>
    <script id="theme-pre-paint">
      // Spec 0002 (AC-7, AC-8): kayıtlı tema seçimi sayfa ilk çizilmeden uygulanır, açılışta yanlış renk parlaması olmaz.
      // Mantık @okul/theme/src/preference.ts'in düz JS kopyasıdır; prePaint.test.ts ikisini aynı vakalarla sınar (T11).
      (function () {
        var preference = "system";
        try {
          var stored = window.localStorage.getItem("okul.theme");
          if (stored === "light" || stored === "dark" || stored === "system") preference = stored;
        } catch (e) {}
        var deviceDark = false;
        try {
          deviceDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        } catch (e) {}
        var scheme = preference === "system" ? (deviceDark ? "dark" : "light") : preference;
        document.documentElement.setAttribute("data-theme", scheme);
        document.documentElement.style.colorScheme = scheme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
