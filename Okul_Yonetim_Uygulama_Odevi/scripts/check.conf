# scripts/check.conf — Okul Yönetim Platformu doğrulama sözleşmesi (./scripts/check).
# GREENFIELD (bootstrap 2026-11-19): henüz kod yok (kural 1: spec yoksa kod yok). Aşağıdaki adımlar
# PLANLANMIŞTIR ve yorum satırıdır; ilk spec olan walking skeleton bunları oluşturup yorumdan çıkarır.
# Format: <ad>: <komut> — sırayla, ilk hatada durur. Hızlı adımların ADINDA [fast].
# Fast/full ayrımı seçiciyle (Category=Integration trait'i), asla dosya/proje listesiyle değil.
#
# --- Önkoşullar (walking skeleton ile açılır) ---
# requires build: dotnet --version
# requires integration-test: pg_isready -h localhost -p 5432
# requires web-lint: node --version
#
# --- Backend (.NET 10) ---
# resource hygiene: no MSBuild node reuse / build server (T6) — her dotnet adımında
#   DOTNET_CLI_USE_MSBUILD_SERVER=0, -nodeReuse:false, --disable-build-servers
# build [fast]: cd backend && DOTNET_CLI_USE_MSBUILD_SERVER=0 dotnet build OkulYonetim.sln -c Release -nodeReuse:false --disable-build-servers
#   (K1/K2/K3 analizörleri burada: tek uyarı = hata)
# unit-test [fast]: cd backend && DOTNET_CLI_USE_MSBUILD_SERVER=0 dotnet test OkulYonetim.sln -c Release --no-build --filter "Category!=Integration" -nodeReuse:false --disable-build-servers
#   (Unit + Architecture: yasak bağımlılıklar, K3 summary testi)
# integration-test: cd backend && DOTNET_CLI_USE_MSBUILD_SERVER=0 dotnet test OkulYonetim.sln -c Release --no-build --filter "Category=Integration" -nodeReuse:false --disable-build-servers
#   (gerçek PostgreSQL 18; her koşu okul_test_<guid> açar ve siler — resource hygiene kural 5)
# vulnerable-packages: cd backend && dotnet list OkulYonetim.sln package --vulnerable --include-transitive  (+ çıktıda bulgu varsa exit 1 sarmalayıcısı)
#
# --- Web / mobil / ortak istemci (TypeScript) ---
# web-lint [fast]: npm --prefix web run lint -- --max-warnings 0
# web-typecheck [fast]: npm --prefix web run typecheck
# web-test [fast]: npm --prefix web test -- --run
# mobile-lint [fast]: npm --prefix mobile run lint -- --max-warnings 0
# mobile-typecheck [fast]: npm --prefix mobile run typecheck
# mobile-test [fast]: npm --prefix mobile test -- --ci --watchAll=false
# npm-audit: npm --prefix web audit --audit-level=high && npm --prefix mobile audit --audit-level=high
