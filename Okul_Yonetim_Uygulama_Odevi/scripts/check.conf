# scripts/check.conf — Okul Yönetim Platformu doğrulama sözleşmesi (./scripts/check). Spec 0001 ile açıldı.
# Format: <ad>: <komut> — sırayla, ilk hatada durur. Hızlı adımların ADINDA [fast]; ./scripts/check --fast yalnızca onları.
# Backend testleri seçiciyle ayrılır (Category=Integration trait'i), dosya/proje listesiyle değil (docs/testing.md, kural 4).
# Her adım arkada süreç bırakmaz (docs/testing.md, Resource hygiene); yazdığı veri sonraki koşuya geçmez.
#
# --- Önkoşullar ---
requires backend-build: dotnet --version
requires integration-test: node tools/check/pg-ready.mjs
requires ts-typecheck: node -e "require.resolve('typescript/package.json')"

# --- Backend (.NET 10) ---
# resource hygiene: MSBuild sunucusu / node yeniden kullanımı / Roslyn sunucusu yok (T6)
backend-build [fast]: cd backend && DOTNET_CLI_USE_MSBUILD_SERVER=0 DOTNET_CLI_TELEMETRY_OPTOUT=1 dotnet build OkulYonetim.sln -c Release -nodeReuse:false --disable-build-servers -p:UseSharedCompilation=false -v:q -nologo
# Unit + Architecture (yasak bağımlılıklar, tip başına summary, derleme kuralları); 0 test = kırmızı
backend-test [fast]: sh tools/check/dotnet-test.sh fast
# Ortak istemci, build'in ürettiği openapi.json ile güncel mi
api-client-fresh [fast]: node tools/check/api-client-fresh.mjs

# --- Web / mobil / ortak istemci (TypeScript) ---
ts-typecheck [fast]: npm run --silent typecheck
ts-lint [fast]: npm run --silent lint
# resource hygiene: tek işçi, izleme modu yok
# Ortak tema: renk çiftlerinin kontrastı (WCAG AA) ve tema seçimi mantığı
theme-test [fast]: npm --workspace packages/theme run --silent test
web-test [fast]: npm --workspace web run --silent test
mobile-test [fast]: npm --workspace mobile run --silent test

# --- Yalnızca tam profil ---
# Gerçek PostgreSQL 18; her koşu okul_test_<zaman>_<guid> açar ve siler; yalnızca 1 saatten eski artıkları temizler (resource hygiene kural 5)
integration-test: sh tools/check/dotnet-test.sh full
dotnet-vulnerable: sh tools/check/dotnet-vuln.sh
npm-audit: npm audit --audit-level=high
