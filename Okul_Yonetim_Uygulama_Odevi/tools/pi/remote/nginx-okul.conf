# Okul Yönetim — web paneli + API ağ geçidi (spec 0003). setup-remote.sh @...@ yer tutucularını doldurur.
# Yalnızca @WEB_PORT@ portunu dinler; Pi'deki diğer siteler/portlar etkilenmez. Web dosyaları ayrı birimdir
# (/opt/okul/web/current); /api istekleri Pi'nin içindeki API'ye (127.0.0.1:@API_PORT@) iletilir.
server {
    listen @WEB_PORT@;
    listen [::]:@WEB_PORT@;
    server_name _;
    server_tokens off;

    root /opt/okul/web/current;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:@API_PORT@;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Tek sayfa uygulaması: derin bağlantı ve sayfa yenilemede index.html döner (AC-1)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
