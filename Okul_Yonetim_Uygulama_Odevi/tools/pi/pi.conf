# Raspberry Pi deneme ortamı — tek ayar dosyası (spec 0003, Ö-1).
# Pi'nin IP'si değişirse yalnızca PI_ADDRESS'i değiştir (web aynı adresten çalıştığı için yeniden derleme gerekmez;
# mobilde EXPO_PUBLIC_API_BASE_URL güncellenir). Önerilen: modemde Pi'ye sabit IP ver.
# Şifre veya gizli bilgi bu dosyaya YAZILMAZ; veritabanı şifresi yalnızca Pi'de /etc/okul/okul-api.env içindedir.

# ~/.ssh/config içindeki SSH tanımı (anahtarla giriş)
PI_SSH=tmpi
# Pi'nin yerel ağ adresi (tarayıcı ve mobil buraya bağlanır)
PI_ADDRESS=192.168.1.102
# nginx: web paneli + /api ağ geçidi (dışarıya açık tek port)
WEB_PORT=8080
# API yalnızca Pi'nin içinden dinler (127.0.0.1)
API_PORT=5080
# Pi'de tutulan sürüm sayısı (birim başına)
KEEP_RELEASES=2
# Bu kadar MB'tan az boş alan varsa kurulum/dağıtım durur (Ö-5)
MIN_FREE_MB=1024
