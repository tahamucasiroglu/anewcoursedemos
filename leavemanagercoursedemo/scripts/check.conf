# scripts/check.conf — Leave Manager (.NET 10, ASP.NET Core MVC, EF Core + SQLite)
# Bootstrap 2026-11-07; activated by spec 0001 (walking skeleton).
# Format: <name>: <command> — in order, fail fast. The [fast] tag lives in the NAME.
#
# --- Prerequisites ---
requires build: dotnet --list-sdks | grep -q "^10\."
# vulnerable needs network (nuget.org); offline, the full profile is red (plan 0001, risk 7).
#
# --- Resource hygiene inventory (docs/testing.md, Resource hygiene) ---
# dotnet build  → MSBuild worker nodes + Roslyn VBCSCompiler server could survive.
# dotnet test   → test host processes exit at the end of the run; MSBuild nodes as above.
# dotnet format → MSBuild workspace, in-process.
# Web.Tests     → TestServer is in-process (no port, no Kestrel); SQLite :memory: dies with its
#                 connection when the factory is disposed (no data residue, rule 5).
# Every step: resource hygiene: no MSBuild node reuse (MSBUILDDISABLENODEREUSE=1, -nr:false),
#             resource hygiene: no shared compiler server (UseSharedCompilation=false),
#             plus `dotnet build-server shutdown` inside the same step, keeping its exit code.
#
# --- Test runner: Microsoft Testing Platform (global.json; plan 0001, A-1) ---
# Split by selector, never by list (docs/testing.md, Two speeds rule 4): integration tests carry
# [Trait("Category", "Integration")]; fast = --filter-not-trait, full-only = --filter-trait.
# A test assembly the selector leaves empty exits 8 ("zero tests ran") → --ignore-exit-code 8,
# and the step itself fails when the WHOLE selection ran zero tests (DOTNET_CLI_UI_LANGUAGE=en
# keeps the "total:" summary line parseable; on CI the runner colours its output, so --no-ansi
# plus an escape-code strip keep it parseable there too — CI run of 3fa9a3a), so a selector that
# silently matches nothing is red.
#
build [fast]: sh -c 'export MSBUILDDISABLENODEREUSE=1 DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1; dotnet build LeaveManager.slnx -c Release -nr:false -p:UseSharedCompilation=false; rc=$?; dotnet build-server shutdown >/dev/null 2>&1; exit $rc'
format [fast]: sh -c 'export MSBUILDDISABLENODEREUSE=1 DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1; dotnet format LeaveManager.slnx --verify-no-changes --no-restore; rc=$?; dotnet build-server shutdown >/dev/null 2>&1; exit $rc'
test-unit [fast]: sh -c 'export MSBUILDDISABLENODEREUSE=1 DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1 DOTNET_CLI_UI_LANGUAGE=en; out=$(dotnet test --solution LeaveManager.slnx -c Release --no-build --filter-not-trait "Category=Integration" --ignore-exit-code 8 --no-ansi 2>&1); rc=$?; printf "%s\n" "$out"; dotnet build-server shutdown >/dev/null 2>&1; [ $rc -eq 0 ] || exit $rc; n=$(printf "%s\n" "$out" | sed "s/\x1b\[[0-9;]*[A-Za-z]//g" | sed -n "s/.*total: *\([0-9][0-9]*\).*/\1/p" | tail -n 1); [ "${n:-0}" -gt 0 ] || { echo "check: test-unit ran zero tests" >&2; exit 1; }'
test-integration: sh -c 'export MSBUILDDISABLENODEREUSE=1 DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1 DOTNET_CLI_UI_LANGUAGE=en; out=$(dotnet test --solution LeaveManager.slnx -c Release --no-build --filter-trait "Category=Integration" --ignore-exit-code 8 --no-ansi 2>&1); rc=$?; printf "%s\n" "$out"; dotnet build-server shutdown >/dev/null 2>&1; [ $rc -eq 0 ] || exit $rc; n=$(printf "%s\n" "$out" | sed "s/\x1b\[[0-9;]*[A-Za-z]//g" | sed -n "s/.*total: *\([0-9][0-9]*\).*/\1/p" | tail -n 1); [ "${n:-0}" -gt 0 ] || { echo "check: test-integration ran zero tests" >&2; exit 1; }'
# `dotnet list package --vulnerable` exits 0 even with findings: the output is kept aside and the
# step decides on the command's own code plus the finding text (full-only: needs network).
vulnerable: sh -c 'export DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1 DOTNET_CLI_UI_LANGUAGE=en; out=$(dotnet list LeaveManager.slnx package --vulnerable --include-transitive 2>&1); rc=$?; printf "%s\n" "$out"; dotnet build-server shutdown >/dev/null 2>&1; [ $rc -eq 0 ] || exit $rc; case "$out" in *"has the following vulnerable packages"*) exit 1 ;; esac; exit 0'
