# scripts/check.conf — LeaveManager (bootstrap 2026-11-14)
# Format: <name>: <command> · [fast] in the NAME · requires <step>: <command>  (see check.conf.example)
#
# GREENFIELD: kod yok (invariant 1: no spec, no code). Planlanan adımlar aşağıda YORUM olarak durur;
# walking skeleton spec'i (ilk spec) çözüm/paketleri kurar, bu satırların yorumunu kaldırır, residue testini
# (./scripts/residue ve --fast) koşar ve her test adımının test sayısını doğrular.
#
# Resource hygiene envanteri (docs/testing.md):
#  - dotnet: MSBuild node reuse ve build server (Roslyn/VBCSCompiler, Razor) süreç bırakır → -nr:false + build-server shutdown
#  - dotnet test: testhost çalışma bitince kapanır; veritabanı kullanılmaz (yalnız birim + mimari testleri) → veri artığı yok
#  - npm/vite/vitest: watch modu check'e girmez (vitest --run, tsc -b); kalıcı sunucu yok
#
# --- Gereksinimler (makinenin koşabilmesi için) ---
# requires backend-build: dotnet --version
# requires frontend-lint: node -e "process.exit(+process.versions.node.split('.')[0] >= 22 ? 0 : 1)"
#
# --- Backend ---
# resource hygiene: no MSBuild node reuse, no build server (DOTNET_CLI_USE_MSBUILD_SERVER=0)
# backend-format [fast]: dotnet format backend/LeaveManager.slnx --verify-no-changes
# backend-build [fast]: sh -c 'DOTNET_CLI_USE_MSBUILD_SERVER=0 dotnet build backend/LeaveManager.slnx -c Release -nr:false -p:UseSharedCompilation=false; rc=$?; dotnet build-server shutdown >/dev/null 2>&1; exit $rc'
# backend-test [fast]: sh -c 'DOTNET_CLI_USE_MSBUILD_SERVER=0 dotnet test backend/LeaveManager.slnx -c Release --no-build; rc=$?; dotnet build-server shutdown >/dev/null 2>&1; exit $rc'
# backend-vulnerable: sh -c 'out=$(dotnet list backend/LeaveManager.slnx package --vulnerable --include-transitive) || exit 1; echo "$out"; ! echo "$out" | grep -qiE "\b(High|Critical)\b"'
#
# --- Frontend ---
# frontend-install [fast]: npm --prefix frontend ci --no-audit --no-fund
# frontend-lint [fast]: npm --prefix frontend run lint
# frontend-typecheck [fast]: npm --prefix frontend run typecheck
# frontend-test [fast]: npm --prefix frontend run test -- --run --passWithNoTests
# frontend-audit: npm --prefix frontend audit --audit-level=high
