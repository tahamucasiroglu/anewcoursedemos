# scripts/check.conf — LeaveManager (bootstrap 2026-11-14, opened by spec 0001)
# Format: <name>: <command> · [fast] in the NAME · requires <step>: <command>  (see check.conf.example)
# Every step runs as: cd <project root> && sh -c "<command>". Gate on exit codes only — tool output is localized.
#
# Resource hygiene inventory (docs/testing.md):
#  - dotnet build/format/list: MSBuild node reuse and the MSBuild server outlive the command; the Roslyn
#    compiler server (VBCSCompiler) is shared per user. Neutralized per step with MSBUILDDISABLENODEREUSE=1,
#    DOTNET_CLI_USE_MSBUILD_SERVER=0, -nr:false and -p:UseSharedCompilation=false.
#    NEVER `dotnet build-server shutdown`: it kills other sessions' shared compiler servers (plan 0001, R-4).
#  - dotnet test (Microsoft.Testing.Platform, global.json): test host exits with the run; no database → no data residue.
#    A test project with zero tests fails the run (exit 8) — the test-count guard.
#  - npm/eslint/prettier/tsc: run-once commands, no watch mode, no server; npm audit is network-only.
#
# --- Prerequisites ---
requires backend-build: dotnet --version
requires frontend-install: node -e "process.exit(+process.versions.node.split('.')[0] >= 22 ? 0 : 1)"
#
# --- Backend ---
# resource hygiene: no MSBuild node reuse, no MSBuild server, no shared compiler server
backend-format [fast]: MSBUILDDISABLENODEREUSE=1 DOTNET_CLI_USE_MSBUILD_SERVER=0 dotnet format backend/LeaveManager.slnx --verify-no-changes
backend-build [fast]: MSBUILDDISABLENODEREUSE=1 DOTNET_CLI_USE_MSBUILD_SERVER=0 dotnet build backend/LeaveManager.slnx -c Release -nr:false -p:UseSharedCompilation=false
backend-test [fast]: MSBUILDDISABLENODEREUSE=1 DOTNET_CLI_USE_MSBUILD_SERVER=0 dotnet test --solution backend/LeaveManager.slnx -c Release --no-build
# dotnet list --vulnerable exits 0 even with findings → gate on the JSON severity (docs/security.md, Dependencies)
backend-vulnerable: out=$(MSBUILDDISABLENODEREUSE=1 DOTNET_CLI_USE_MSBUILD_SERVER=0 dotnet list backend/LeaveManager.slnx package --vulnerable --include-transitive --format json) || exit 1; ! echo "$out" | grep -qiE '"severity": *"(High|Critical)"' || { echo "$out"; exit 1; }
#
# --- Frontend ---
frontend-install [fast]: npm --prefix frontend ci --no-audit --no-fund
frontend-lint [fast]: npm --prefix frontend run lint
frontend-typecheck [fast]: npm --prefix frontend run typecheck
# frontend-test: opened with the first necessary unit test (docs/testing.md; plan 0001, R-5)
# frontend-test [fast]: npm --prefix frontend run test -- --run
frontend-audit: npm --prefix frontend audit --audit-level=high
